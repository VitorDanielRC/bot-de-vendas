services:
  promo-bot:
    build:
      context: .
      target: runtime
    container_name: promo-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      waha:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no arquivo .env}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Defina WAHA_DASHBOARD_PASSWORD no arquivo .env}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:?Defina WHATSAPP_SWAGGER_PASSWORD no arquivo .env}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

  tests:
    profiles: ["test"]
    build:
      context: .
      target: tests
    environment:
      RUN_SCAN_ON_STARTUP: "false"
      DATABASE_PATH: /tmp/promotions-test.db

volumes:
  waha_sessions:
  waha_media:
